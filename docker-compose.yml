version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic_backend
    env_file:
      - .env.docker
    ports:
      - "8002:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg16
    container_name: traffic_postgres
    environment:
      POSTGRES_DB: traffic_project
      POSTGRES_USER: traffic_agent
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U traffic_agent -d traffic_project"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: